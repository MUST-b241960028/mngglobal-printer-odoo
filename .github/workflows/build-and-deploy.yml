name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:  # manual trigger button

jobs:
  # ══════════════════════════════════════════════════════════
  # BUILD WINDOWS .EXE
  # ══════════════════════════════════════════════════════════
  build-exe:
    name: 🔨 Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyinstaller pystray Pillow

      - name: Download SumatraPDF
        run: |
          Invoke-WebRequest -Uri "https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2.exe" -OutFile "SumatraPDF.exe"
        shell: pwsh

      - name: Build .exe
        run: |
          pyinstaller --onefile --windowed `
            --name "MNG_Printer_Bridge" `
            --add-data "SumatraPDF.exe;." `
            --add-data "icon.png;." `
            printer_bridge.py
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNG_Printer_Bridge
          path: dist/MNG_Printer_Bridge.exe

  # ══════════════════════════════════════════════════════════
  # DEPLOY ODOO MODULE TO VPS
  # ══════════════════════════════════════════════════════════
  deploy-odoo:
    name: 🚀 Deploy Odoo Module
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 46.250.244.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "Updating MNG modules..."
            # This is the active addons path from /etc/odoo19.conf on the VPS.
            ADDON_PATH="/opt/odoo19/odoo19/custom-addons"

            # Remove old modules (git history is our backup)
            for MODULE in mngglobal_printer mngglobal_visa mngglobal_logs; do
              rm -rf "$ADDON_PATH/$MODULE"
            done

            # Clean any leftover backups
            rm -rf "$ADDON_PATH"/*_backup_*

      - name: Copy module files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.250.244.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "odoo_module/mngglobal_printer,odoo_module/mngglobal_visa,odoo_module/mngglobal_logs"
          target: /opt/odoo19/odoo19/custom-addons
          strip_components: 1

      - name: Verify deployed workspace files
        uses: appleboy/ssh-action@v1
        with:
          host: 46.250.244.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            ADDON_PATH="/opt/odoo19/odoo19/custom-addons"
            test -f "$ADDON_PATH/mngglobal_visa/static/src/js/cohort_workspace.js"
            test -f "$ADDON_PATH/mngglobal_visa/views/visa_cohort_workspace_views.xml"
            grep -q '"version": "2.3.0"' "$ADDON_PATH/mngglobal_visa/__manifest__.py"

      - name: Restart Odoo & Upgrade Module
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -o pipefail
            echo "Stopping Odoo..."
            sudo systemctl stop odoo19

            echo "Upgrading MNG modules..."
            UPGRADE_LOG=$(mktemp)
            sudo -u odoo19 /opt/odoo19/odoo19-venv/bin/python3 /opt/odoo19/odoo19/odoo-bin \
              -c /etc/odoo19.conf \
              -d ${{ secrets.ODOO_DB }} \
              -i mngglobal_logs \
              -u mngglobal_printer,mngglobal_visa,mngglobal_logs \
              --stop-after-init > "$UPGRADE_LOG" 2>&1
            UPGRADE_EXIT=$?

            echo "Starting Odoo..."
            sudo systemctl start odoo19

            if [ $UPGRADE_EXIT -ne 0 ]; then
              echo "=========== UPGRADE FAILED (exit=$UPGRADE_EXIT) ==========="
              tail -80 "$UPGRADE_LOG"
              rm -f "$UPGRADE_LOG"
              exit $UPGRADE_EXIT
            fi
            echo "--- Upgrade tail ---"
            tail -20 "$UPGRADE_LOG"
            rm -f "$UPGRADE_LOG"

            # Increase nginx upload limit for document attachments
            NGINX_CONF="/etc/nginx/conf.d/odoo_upload.conf"
            if [ ! -f "$NGINX_CONF" ] || ! grep -q "client_max_body_size 50m" "$NGINX_CONF" 2>/dev/null; then
              echo "Setting nginx client_max_body_size to 50m..."
              echo "client_max_body_size 50m;" | sudo tee "$NGINX_CONF" > /dev/null
              sudo nginx -t && sudo systemctl reload nginx
            fi

            echo "Deploy complete!"

  # ══════════════════════════════════════════════════════════
  # CREATE GITHUB RELEASE (on tag push)
  # ══════════════════════════════════════════════════════════
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    needs: build-exe
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .exe artifact
        uses: actions/download-artifact@v4
        with:
          name: MNG_Printer_Bridge
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MNG Printer Bridge ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🖨️ MNG Printer Bridge ${{ steps.version.outputs.VERSION }}

            ### Суулгах заавар:
            1. `MNG_Printer_Bridge.exe` файлыг татаж аваад ажлын компьютерт хуулна
            2. Давхар дарж нээнэ
            3. Odoo холболтын мэдээллээ оруулна
            4. "Start Printing" товч дарна

            ### Шинэ өөрчлөлтүүд:
            - Энэ хувилбарын өөрчлөлтүүдийг доорх commit-уудаас харна уу
          files: |
            dist/MNG_Printer_Bridge.exe
          draft: false
          prerelease: false
